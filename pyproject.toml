[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trackguard"
version = "0.1.0"
description = "Cascaded identity-drift correction for online multi-object tracking"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "torch>=2.1",
    "scikit-learn>=1.3",
    "Pillow>=9.5",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
include = ["trackguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
